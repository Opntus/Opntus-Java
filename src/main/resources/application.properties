server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.max-http-request-header-size=16KB
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:opntus.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
opntus.admin-emails=${OPNTUS_ADMIN_EMAILS:opntus.1@gmail.com}
server.error.include-message=never
server.error.include-stacktrace=never
opntus.supabase.url=${SUPABASE_URL:}
opntus.supabase.key=${SUPABASE_PUBLISHABLE_KEY:}
